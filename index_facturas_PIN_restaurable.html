<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mis Facturas">
<link rel="manifest" href="manifest.webmanifest">
<title>Mis Facturas</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f4f6f8}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}
header{background:#0f172a;color:white;padding:calc(16px + env(safe-area-inset-top)) 18px 16px;position:sticky;top:0;z-index:2}
header h1{margin:0;font-size:22px} header small{opacity:.75}
main{max-width:700px;margin:auto;padding:16px 14px 100px}
.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0000000d}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{text-align:center}.stat b{display:block;font-size:22px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}input,select{width:100%;padding:12px;border:1px solid #d6dae1;border-radius:10px;background:white}
button{border:0;border-radius:11px;padding:12px 15px;font-weight:700;cursor:pointer}.primary{background:#0f172a;color:white}.danger{background:#fee2e2;color:#991b1b}.ghost{background:#eef2f7;color:#172033}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.invoice{border-left:5px solid #f59e0b}.invoice.paid{border-left-color:#22c55e}.invoice h3{margin:0 0 5px}.muted{color:#667085;font-size:13px}.amount{font-size:19px;font-weight:800}
.hidden{display:none!important}.empty{text-align:center;color:#667085;padding:25px}
#lock{position:fixed;inset:0;background:#0f172a;color:white;z-index:10;display:flex;align-items:center;justify-content:center;padding:25px}
.lockbox{width:min(360px,100%);text-align:center}.lockbox input{text-align:center;font-size:25px;letter-spacing:8px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:9px max(10px,env(safe-area-inset-left)) calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px}
nav button{flex:1;max-width:220px}
</style>
</head>
<body>
<div id="lock">
  <div class="lockbox">
    <h1>Mis Facturas</h1><p id="lockText">Introduce tu PIN</p>
    <input id="pinInput" inputmode="numeric" maxlength="8" type="password" autocomplete="off">
    <div class="actions" style="justify-content:center"><button class="primary" id="pinBtn">Entrar</button><button class="ghost" id="forgotPinBtn">He olvidado mi PIN</button></div>
    <p class="muted" id="firstPinHint" style="color:#cbd5e1">La primera vez podrás crear tu PIN.</p>
  </div>
</div>

<header><h1>Mis Facturas</h1><small>Control sencillo de facturas pendientes</small></header>
<main>
<section class="card stats">
 <div class="stat"><span class="muted">Pendientes</span><b id="pendingCount">0</b></div>
 <div class="stat"><span class="muted">Pendiente €</span><b id="pendingTotal">0,00</b></div>
 <div class="stat"><span class="muted">Total</span><b id="allTotal">0,00</b></div>
</section>

<section class="card">
 <h2 style="margin-top:0">Nueva factura</h2>
 <label>Cliente</label><input id="client" placeholder="Nombre del cliente">
 <label>Número</label><input id="number" placeholder="Ej. F-2026-001">
 <label>Fecha</label><input id="date" type="date">
 <label>Importe (€)</label><input id="amount" type="number" min="0" step="0.01" placeholder="0,00">
 <label>Estado</label><select id="status"><option value="pending">Pendiente</option><option value="paid">Cobrada</option></select>
 <div class="actions"><button class="primary" id="saveBtn">Guardar factura</button></div>
</section>

<section>
 <div class="row between"><h2>Mis facturas</h2><select id="filter" style="width:auto"><option value="all">Todas</option><option value="pending">Pendientes</option><option value="paid">Cobradas</option></select></div>
 <div id="list"></div>
</section>

<section class="card">
 <h3>Datos</h3>
 <div class="actions">
  <button class="ghost" id="exportBtn">Exportar copia</button>
  <button class="ghost" id="importBtn">Importar copia</button>
  <button class="danger" id="resetBtn">Borrar todos los datos</button>
 </div>
 <input id="fileInput" type="file" accept="application/json" class="hidden">
</section>
</main>
<nav><button class="ghost" id="changePinBtn">Cambiar PIN</button><button class="ghost" id="lockBtn">Bloquear</button></nav>

<script>
const KEY='misFacturasData_v1', PINKEY='misFacturasPin_v1';
let invoices=JSON.parse(localStorage.getItem(KEY)||'[]');
const $=id=>document.getElementById(id);
const money=n=>Number(n||0).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
function save(){localStorage.setItem(KEY,JSON.stringify(invoices));render()}
function render(){
 const f=$('filter').value;
 const shown=invoices.filter(x=>f==='all'||x.status===f);
 $('pendingCount').textContent=invoices.filter(x=>x.status==='pending').length;
 $('pendingTotal').textContent=money(invoices.filter(x=>x.status==='pending').reduce((a,x)=>a+Number(x.amount),0));
 $('allTotal').textContent=money(invoices.reduce((a,x)=>a+Number(x.amount),0));
 $('list').innerHTML=shown.length?shown.map(x=>`<article class="card invoice ${x.status==='paid'?'paid':''}">
   <div class="row between"><h3>${esc(x.client||'Sin cliente')}</h3><span class="amount">${money(x.amount)} €</span></div>
   <div class="muted">${esc(x.number||'Sin número')} · ${esc(x.date||'Sin fecha')}</div>
   <div style="margin-top:8px">${x.status==='paid'?'✅ Cobrado':'⏳ Pendiente'}</div>
   <div class="actions"><button class="ghost" onclick="toggleStatus('${x.id}')">${x.status==='paid'?'Marcar pendiente':'Marcar cobrada'}</button><button class="danger" onclick="removeInvoice('${x.id}')">Eliminar</button></div>
 </article>`).join(''):'<div class="empty">No hay facturas aquí.</div>';
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toggleStatus(id){const x=invoices.find(x=>x.id===id);if(x){x.status=x.status==='paid'?'pending':'paid';save()}}
function removeInvoice(id){if(confirm('¿Eliminar esta factura?')){invoices=invoices.filter(x=>x.id!==id);save()}}
$('saveBtn').onclick=()=>{
 const client=$('client').value.trim(), amount=parseFloat($('amount').value);
 if(!client||!Number.isFinite(amount)){alert('Indica al menos el cliente y un importe.');return}
 invoices.unshift({id:crypto.randomUUID?crypto.randomUUID():Date.now().toString(),client,number:$('number').value.trim(),date:$('date').value,amount,status:$('status').value});
 ['client','number','date','amount'].forEach(id=>$(id).value='');save()
};
$('filter').onchange=render;
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(invoices,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mis-facturas-copia.json';a.click();URL.revokeObjectURL(a.href)};
$('importBtn').onclick=()=>$('fileInput').click();
$('fileInput').onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;invoices=d;save();alert('Copia importada.')}catch{alert('Archivo no válido.')}};r.readAsText(file)};
$('resetBtn').onclick=()=>{if(confirm('Se borrarán todas las facturas de este dispositivo. ¿Continuar?')){invoices=[];save()}};
function lock(){ $('lock').classList.remove('hidden'); $('pinInput').value=''; $('pinInput').focus() }
$('lockBtn').onclick=lock;
$('changePinBtn').onclick=()=>{const p=prompt('Introduce el nuevo PIN (4-8 números):');if(p&&/^\\d{4,8}$/.test(p)){localStorage.setItem(PINKEY,p);alert('PIN cambiado.')}else if(p)alert('El PIN debe tener entre 4 y 8 números.')};
function unlock(){
 const p=$('pinInput').value, saved=localStorage.getItem(PINKEY);
 if(!saved){if(/^\\d{4,8}$/.test(p)){localStorage.setItem(PINKEY,p);$('lock').classList.add('hidden');$('firstPinHint').classList.add('hidden');render()}else alert('Crea un PIN de 4 a 8 números.')}
 else if(p===saved){$('lock').classList.add('hidden');render()}else alert('PIN incorrecto.');
}
function forgotPin(){
  if(confirm('Esto solo borrará el PIN guardado. Tus facturas NO se borrarán. ¿Continuar?')){
    localStorage.removeItem(PINKEY);
    $('pinInput').value='';
    $('firstPinHint').classList.remove('hidden');
    alert('PIN restablecido. Ahora puedes crear un PIN nuevo de 4 a 8 números.');
    $('pinInput').focus();
  }
}
$('forgotPinBtn').onclick=forgotPin;
$('pinBtn').onclick=unlock;$('pinInput').onkeydown=e=>{if(e.key==='Enter')unlock()};
$('date').value=new Date().toISOString().slice(0,10);
if(localStorage.getItem(PINKEY))$('firstPinHint').classList.add('hidden');
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
